name: YOKEY RIDE Evaluation Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/yokey-ride-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated YOKEY source
        uses: actions/checkout@v4
        with:
          ref: yokey-ride-eval-20260923
      - name: Ensure Pages site exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "Pages configure HTTP ${code}"
          if [ "${code}" != "201" ] && [ "${code}" != "409" ] && [ "${code}" != "422" ]; then
            cat /tmp/pages.json
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
